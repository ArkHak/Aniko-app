[versions]
# --- Build toolchain ---
agp = "8.13.2"
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"
jvmTarget = "17"
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

# --- Kotlin ecosystem ---
coroutines = "1.11.0"
serialization = "1.11.0"

# --- Networking ---
ktor = "3.5.2"

# --- DI ---
koin = "4.2.2"

# --- Compose Multiplatform ecosystem (JetBrains multiplatform ports of AndroidX) ---
navigationCompose = "2.9.2"
# ВНИМАНИЕ: 2.11.0 тянет androidx.lifecycle 2.11, который требует compileSdk 37 и AGP 9.1+.
# compileSdk 37 сейчас недоступен в SDK, поэтому lifecycle зафиксирован на 2.10.0.
# Поднимать вместе с AGP 9.x + compileSdk 37.
lifecycle = "2.10.0"

# --- Images ---
coil = "3.5.0"

# --- Preferences / token storage ---
multiplatformSettings = "1.3.0"

# --- i18n (P2.T7/P2.T8: CMP Resources runtime locale override is not possible — its
# ResourceEnvironment/LocalComposeEnvironment are `internal`, confirmed by a compile spike, see
# docs/REELWAVE_PLAN.md) ---
lyricist = "1.7.0"

# --- Android-only ---
androidxActivityCompose = "1.12.4"
androidxSecurityCrypto = "1.1.0"
# P8: JS-мост к <video> внутри embed-страницы. Платформенный android.webkit тут бесполезен —
# `evaluateJavascript` работает только в главном фрейме, а видео всегда в cross-origin подфрейме.
# Нужны `addDocumentStartJavaScript` + `addWebMessageListener`, они есть только в androidx.webkit.
androidxWebkit = "1.14.0"
# P10.T1: WorkManager — единственный поддерживаемый способ получить периодическую фоновую задачу,
# переживающую закрытие приложения (JobScheduler/AlarmManager напрямую — ниже уровнем и без
# гарантий Doze-совместимости). CoroutineWorker живёт в -ktx-артефакте.
androidxWork = "2.10.1"

# --- Code quality (P1.T11) ---
ktlintGradle = "14.2.0"
detekt = "1.23.8"

# --- Local storage (P4.S0) ---
sqldelight = "2.3.2"

# --- Adaptive layout (P5.T3/P5.T4) ---
# ВНИМАНИЕ: группа org.jetbrains.compose.material3.adaptive версионируется НЕЗАВИСИМО и от плагина
# Compose Multiplatform (1.11.1), и от material3 (compose.material3 резолвится в 1.9.0 — версии
# material3:1.11.1 НЕ существует, не пытаться подставить). 1.2.0 — последняя стабильная; таргеты
# android/desktop/iosArm64/iosSimulatorArm64/iosX64 подтверждены. Транзитивно тянет
# org.jetbrains.androidx.window:window-core:1.4.0 (обычный Maven Central артефакт, доп. правок в
# settings.gradle.kts не требует).
material3Adaptive = "1.2.0"

[libraries]
# Gradle plugin artifacts, consumed by build-logic convention plugins (not by app modules)
plugin-android-gradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-kotlin-multiplatform = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-kotlin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
plugin-compose-compiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
plugin-compose-multiplatform = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
# org.jlleitschuh.gradle:ktlint-gradle не публикуется в Maven Central, только на Gradle Plugin
# Portal — поэтому build-logic/settings.gradle.kts дополнительно подключает gradlePluginPortal()
# в dependencyResolutionManagement, иначе этот артефакт не резолвится.
plugin-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradle" }
plugin-detekt = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
# detekt-api — API для кастомного detekt-правила (P2.T10, `:detekt-rules`). Обычный библиотечный
# артефакт (не Gradle-плагин), поэтому в отдельной секции [libraries], а не среди plugin-*.
detekt-api = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
plugin-sqldelight = { module = "app.cash.sqldelight:gradle-plugin", version.ref = "sqldelight" }

# Kotlin
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

# Compose Multiplatform ports of AndroidX
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Coil 3
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# Settings
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }
multiplatform-settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatformSettings" }
multiplatform-settings-test = { module = "com.russhwolf:multiplatform-settings-test", version.ref = "multiplatformSettings" }

# i18n
lyricist = { module = "cafe.adriel.lyricist:lyricist", version.ref = "lyricist" }

# Android-only
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidxSecurityCrypto" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }

# SQLDelight (P4.S0)
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
# Дефолтный диалект SQLDelight (sqlite-3-18) не понимает `ON CONFLICT ... DO UPDATE SET`
# (UPSERT, ReleaseCacheStore.upsert) — он появился в SQLite 3.24. Все реальные драйверы проекта
# (Android SQLite, JDBC sqlite-driver на Desktop, native SQLite на iOS) давно новее 3.24.
sqldelight-dialect-sqlite338 = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }

# Adaptive layout (P5.T3/P5.T4)
material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
material3-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "material3Adaptive" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
